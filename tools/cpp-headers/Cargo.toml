[package]
name = "slint-fork-cpp-headers"
description = "Generates the C++ headers of the C ABI that this runtime exports, as upstream's api/cpp/cbindgen.rs does"
authors.workspace = true
edition = "2024"
license.workspace = true
publish = false
rust-version.workspace = true
# The `SLINT_VERSION_*` macros of the headers come from this version, and the C++ code
# that the unmodified compiler generates checks them against the runtime's version.
version.workspace = true

[dependencies]
anyhow = "1.0"
cbindgen = { version = "0.29", default-features = false }
i-slint-common = { workspace = true }
proc-macro2 = "1.0.11"
