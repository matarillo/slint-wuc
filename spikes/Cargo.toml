# Spike binaries. Separate from the runtime workspace on purpose: they depend only on `windows`.
[workspace]
resolver = "3"
members = ["s1-hosting"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Numerics",
    "Graphics",
    "Graphics_DirectX",
    "System",
    "UI",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_Foundation",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
windows-future = "0.3"
windows-numerics = "0.3"
