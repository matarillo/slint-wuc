[package]
name = "slint-fork-test-driver"
description = "Runs the .slint test cases of upstream Slint on this runtime"
authors.workspace = true
# Keep an older edition to ensure the generated code is compatible with users that don't use the latest edition
edition = "2021"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[[bin]]
path = "main.rs"
name = "slint-fork-test-driver"

# Only the generated test binaries use them.
[dev-dependencies]
slint ={ path = "../../crates/slint", features = ["std", "compat-1-2"] }
i-slint-backend-testing = { path = "../../crates/testing", features = ["internal"] }
i-slint-core = { path = "../../crates/core" }

[build-dependencies]
# The compiler is out of scope for this fork: the driver uses the published one, unmodified.
i-slint-compiler = { version = "=1.19.0", features = ["default", "rust", "display-diagnostics", "bundle-translations"] }

rayon = "1"
spin_on = "0.1"
test_driver_lib = { path = "../driverlib" }
