[package]
name = "slint-fork-probe"
description = "Runs code generated by the unmodified upstream slint-build on this runtime"
authors.workspace = true
edition = "2024"
license = "MIT-0 AND MIT"
publish = false
rust-version.workspace = true
version = "0.0.0"

[[bin]]
name = "probe-basics"
path = "src/basics.rs"

[[bin]]
name = "probe-structure"
path = "src/structure.rs"

[[bin]]
name = "probe-effects"
path = "src/effects.rs"

[[bin]]
name = "probe-scrolling"
path = "src/scrolling.rs"

[[bin]]
name = "probe-input"
path = "src/input.rs"

[[bin]]
name = "probe-text"
path = "src/text.rs"

[[bin]]
name = "probe-snapshot"
path = "src/snapshot.rs"

[[bin]]
name = "probe-gallery"
path = "src/gallery.rs"

[[bin]]
name = "probe-popups"
path = "src/popups.rs"

[[bin]]
name = "probe-tray"
path = "src/tray.rs"

[[bin]]
name = "probe-titlebar"
path = "src/titlebar.rs"

[[bin]]
name = "probe-mica"
path = "src/mica.rs"

[[bin]]
name = "probe-perf"
path = "src/perf.rs"

[dependencies]
# `mcp` starts the MCP server when `SLINT_MCP_PORT` is set, for `tools/ui-check`.
# `raw-window-handle-06`: for `probe-mica`, the HWND, as an application gets it from upstream.
slint = { path = "../../crates/slint", features = ["mcp", "raw-window-handle-06"] }
raw-window-handle = "0.6"
# For the visual tree dump of `--check`.
i-slint-core = { path = "../../crates/core" }
# For `probe-snapshot`: headless windows, test fonts, and PNG files.
i-slint-backend-testing = { path = "../../crates/testing", features = ["internal"] }
image = { workspace = true }
# For `probe-perf`: process memory, handle and GDI/USER object counts, and process times.
# For `probe-mica`: the system backdrop.
windows = { workspace = true, features = ["Win32_Graphics_Dwm", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[build-dependencies]
# The compiler is out of scope for this fork: the probe uses the published one, unmodified.
slint-build = "=1.19.0"
