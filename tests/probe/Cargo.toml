# SPDX-License-Identifier: MIT OR Apache-2.0

[package]
name = "slint-fork-probe"
description = "Runs code generated by the unmodified upstream slint-build on this runtime"
authors.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version.workspace = true
version = "0.0.0"

[[bin]]
name = "probe-basics"
path = "src/basics.rs"

[[bin]]
name = "probe-structure"
path = "src/structure.rs"

[[bin]]
name = "probe-effects"
path = "src/effects.rs"

[[bin]]
name = "probe-scrolling"
path = "src/scrolling.rs"

[[bin]]
name = "probe-input"
path = "src/input.rs"

[[bin]]
name = "probe-text"
path = "src/text.rs"

[[bin]]
name = "probe-snapshot"
path = "src/snapshot.rs"

[[bin]]
name = "probe-gallery"
path = "src/gallery.rs"

[[bin]]
name = "probe-popups"
path = "src/popups.rs"

[dependencies]
slint = { path = "../../crates/slint" }
# For the visual tree dump of `--check`.
i-slint-core = { path = "../../crates/core" }
# For `probe-snapshot`: headless windows, test fonts, and PNG files.
i-slint-backend-testing = { path = "../../crates/testing", features = ["internal"] }
image = { workspace = true }

[build-dependencies]
# The compiler is out of scope for this fork: the probe uses the published one, unmodified.
slint-build = "=1.19.0"
