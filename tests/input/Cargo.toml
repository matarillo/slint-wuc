# SPDX-License-Identifier: MIT OR Apache-2.0

[package]
name = "slint-fork-input-tests"
description = "Sends Win32 input messages to windows of code generated by the upstream slint-build"
authors.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version.workspace = true
version = "0.0.0"

[dev-dependencies]
slint = { path = "../../crates/slint" }
i-slint-core = { path = "../../crates/core" }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "=1.19.0"
