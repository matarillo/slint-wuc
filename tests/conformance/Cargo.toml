[package]
name = "slint-fork-conformance"
description = "Checks that the items of this runtime match the names the unmodified upstream compiler uses"
authors.workspace = true
edition = "2024"
license.workspace = true
publish = false
rust-version.workspace = true
version = "0.0.0"

[[test]]
name = "conformance"
path = "conformance.rs"

[dev-dependencies]
# The compiler is out of scope for this fork: the test uses the published one, unmodified.
i-slint-compiler = "=1.19.0"
i-slint-common = { workspace = true }
i-slint-core = { path = "../../crates/core", features = ["rtti"] }
