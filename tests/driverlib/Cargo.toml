[package]
name = "test_driver_lib"
description = "Internal rust test driver"
authors.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[lib]
path = "lib.rs"

[dependencies]
regex = "1.4"
walkdir = "2"

[dev-dependencies]
# The compiler is out of scope for this fork: the test uses the published one, unmodified.
i-slint-compiler = { version = "=1.19.0", features = ["std"] }
