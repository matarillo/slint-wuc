# cSpell: ignore bitflags
[package]
name = "i-slint-core"
description = "Internal Slint Runtime Library."
authors.workspace = true
documentation.workspace = true
edition = "2024"
homepage.workspace = true
keywords = ["gui", "ui", "runtime"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
categories = ["gui", "development-tools"]

[lib]
path = "lib.rs"

[features]
ffi = ["dep:static_assertions", "i-slint-core-macros/ffi"] # Expose C ABI
# Allow the viewer to query at runtime information about item types
rtti = []
# The standard library is always used. Kept as an empty feature so that dependents
# that name it keep working.
std = []
# `Path` support is always compiled in. Kept as an empty feature so that dependents
# (such as the interpreter) that name it keep working.
path = []
# Kept as an empty feature: gettext is not available on Windows, and the feature only
# exposes the no-op `translations::gettext_bindtextdomain`.
gettext-rs = []

unicode = ["unicode-script", "unicode-linebreak"]

# Decode encoded images with the image crate.
image-decoders = ["dep:image", "dep:clru"]
image-default-formats = ["image?/default-formats"]
svg = ["dep:resvg", "i-slint-common/svg-text"]

# Store an image's pixels in the RGB565 format.
# Disabled by default so that applications that don't need it don't pay
# for the extra rendering code.
image-pixel-format-rgb565 = ["i-slint-common/image-pixel-format-rgb565"]

# Store an image's pixels as a single 8 bit grayscale channel.
# Disabled by default so that applications that don't
# need it don't pay for the extra conversion code.
image-pixel-format-gray8 = ["i-slint-common/image-pixel-format-gray8"]

# Keep the textures and bitmap fonts that the interpreter receives as the compiler made them.
owned-pre-rendered-resources = []

box-shadow-cache = []

testing = []

shared-fontique = ["i-slint-common/shared-fontique"]

raw-window-handle-06 = ["dep:raw-window-handle-06"]

## If enabled, calls of `debug()` in `.slint` files use to the [`log::debug!()`] macro
## of the [log](https://crates.io/crates/log) crate instead of just `println!()`.
log = ["dep:log"]

tr = ["dep:tr"]

32-bit-color = []
default = ["std", "unicode", "shared-parley"]

# System tray (`SystemTrayIcon`) support: gates the `Shell_NotifyIconW` backend.
# When disabled, `SystemTrayIcon` constructs against a no-op backend. Opt-in (not part
# of `default`).
system-tray = []

shared-parley = ["shared-fontique", "dep:parley", "dep:skrifa", "dep:icu_normalizer"]

accessibility-text = ["std", "shared-parley", "dep:accesskit"]

shared-swash = ["dep:swash"]

[dependencies]
i-slint-common = { workspace = true, features = ["default", "locale-decimal-separator", "color-parsing", "markdown"] }
i-slint-core-macros = { workspace = true, features = ["default"] }

const-field-offset = { version = "0.2.1" }
vtable = { workspace = true }

portable-atomic = { version = "1", features = ["critical-section"] }
bytemuck = { workspace = true, features = ["derive"] }
derive_more = { workspace = true, features = ["error", "deref", "deref_mut"] }
euclid = { workspace = true, features = ["std"] }
lyon_algorithms = { version = "1.0", default-features = false }
lyon_geom = { version = "1.0", default-features = false }
lyon_path = { workspace = true, default-features = false }
lyon_extra = { version = "1.1", default-features = false }
num-traits = { version = "0.2", default-features = false }
once_cell = { version = "1.5", default-features = false, features = ["critical-section", "std"] }
pin-project = "1"
pin-weak = { version = "1.1", default-features = false }
# Note: the rgb version is extracted in ci.yaml for rustdoc builds
rgb = "0.8.27"
scopeguard = { version = "1.1.0", default-features = false }
slab = { version = "0.4.3", default-features = false }
static_assertions = { version = "1.1", optional = true }
strum = { workspace = true }

log = { workspace = true, optional = true }

# Note: We're migrating our unicode handling over to the icu family of crates.
# Prefer using icu crates over adding more unicode-* dependencies
# parley uses the icu crates internally as well, so we'll share the dependency there.
unicode-segmentation = { workspace = true }
unicode-linebreak = { version = "0.1.5", optional = true }
unicode-script = { version = "0.5.7", optional = true }
icu_normalizer = { workspace = true, optional = true }
sys-locale = { version = "0.3.2" }
accesskit = { version = "0.25", optional = true }

image = { workspace = true, optional = true, default-features = false }
clru = { workspace = true, optional = true }

resvg = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

raw-window-handle-06 = { workspace = true, optional = true, features = ["std"] }
bitflags = { version = "2.4.2" }

chrono = { version = "0.4", default-features = false, features = ["alloc", "std", "clock"] }
skrifa = { workspace = true, optional = true }
swash = { workspace = true, optional = true, features = ["scale"] }

tr = { workspace = true, optional = true }

taffy = { version = "0.15", default-features = false, features = ["flexbox", "taffy_tree", "alloc", "std"] }

parley = { version = "0.12.0", optional = true, features = ["bytemuck", "complex-scripts"] }

windows = { workspace = true, features = [
    "Foundation",
    "Foundation_Collections",
    "Foundation_Numerics",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Graphics_Effects",
    "System",
    "UI",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Direct2D",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
windows-collections = "0.3"
windows-numerics = "0.3"
windows-future = "0.3"


[dev-dependencies]
rustybuzz = { workspace = true }
ttf-parser = { workspace = true }
serde_json = { workspace = true }
tiny-skia = "0.12.0"
tempfile = { version = "3.12.0" }
fontique = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(slint_debug_property)", "cfg(cbindgen)", "cfg(slint_nightly_test)"] }

[lints.clippy]
# Coord is an alias for f32 in most architectures, but not always, so the cast
# to f32 *is* necessary.
unnecessary_cast = { level = "allow" }

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]
