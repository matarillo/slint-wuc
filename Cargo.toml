[workspace]
members = ["crates/core", "crates/core-macros", "crates/common", "crates/slint", "tests/fixtures", "tests/probe", "tests/conformance", "crates/testing", "tests/driver", "tests/driverlib", "tests/input", "tests/screenshots", "tools/ui-check", "tools/cpp-headers", "examples/backdrop"]
# `reference/` is the read-only upstream Slint tree; `spikes/` and `tools/upstream-gallery` are
# workspaces of their own.
exclude = ["reference", "spikes", "tools/upstream-gallery"]
resolver = "3"

[workspace.package]
authors = ["Kentaro Inomata", "Slint Developers <info@slint.dev>"]
homepage = "https://github.com/matarillo/slint-wuc"
license = "GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR LicenseRef-Slint-Software-3.0"
repository = "https://github.com/matarillo/slint-wuc"
rust-version = "1.95"
version = "1.19.0"

[workspace.dependencies]
i-slint-common = { version = "=1.19.0", path = "crates/common", default-features = false }
i-slint-core-macros = { version = "=1.19.0", path = "crates/core-macros", default-features = false }

# Published on crates.io rather than vendored.
vtable = { version = "0.5.1" }

bytemuck = { version = "1.13.1" }
clru = { version = "0.6.0" }
derive_more = { version = "2.0.0", default-features = false, features = ["deref", "deref_mut", "into", "from", "add", "add_assign", "mul", "not", "display"] }
euclid = { version = "0.22.1", default-features = false }
swash = { version = "0.2.7", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
log = { version = "0.4.17" }
# `svgz` was unconditional until resvg 0.48 gated it behind a feature. Slint accepts
# compressed SVGs (`.svgz`), so keep it enabled or usvg rejects them at parse time.
resvg = { version = "0.49.0", default-features = false, features = ["text", "raster-images", "svgz"] }
rustybuzz = { version = "0.20.0" }
serde = { version = "1.0.163", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.96" }
strum = { version = "0.28", default-features = false, features = ["derive"] }
ttf-parser = { version = "0.25" }
raw-window-handle-06 = { package = "raw-window-handle", version = "0.6", features = ["alloc"] }

# Note: We're migrating our unicode handling over to the icu family of crates.
# Prefer using icu crates over adding more unicode-* dependencies
# parley uses the icu crates internally as well, so we'll share the dependency there.
unicode-segmentation = { version = "1.12.0" }
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }

tr = { version = "0.1", default-features = false }
fontique = { version = "0.12.0" }
# Pinned to match parley's version
skrifa = { version = "0.44" }
windows = { version = "0.62" }
lyon_path = { version = "1.0", default-features = false }
